# --- Basic Network Configuration ---
CONFIG_NET_L2_ETHERNET=y

# Increase the network buffer data size to accommodate a full MTU packet
# This prevents fragmentation for large packets and avoids the "Uncontiguous data cannot be linearized" error
CONFIG_NET_BUF_DATA_SIZE=2048

# --- Resource Allocation for Large Packets ---
# Explicitly enable IPv4 fragment reassembly
CONFIG_NET_IPV4_FRAGMENT=y

# DM9051 Ethernet controller driver
CONFIG_ETH_DM9051=y

# SPI support (DM9051 uses SPI interface)
CONFIG_SPI=y
# GPIO support (DM9051 uses GPIO interfaces)
CONFIG_GPIO=y

# TCP/IP extra
# (temp NO tcp)
# (temp NO sockets)
#(CONFIG_NET_TCP=y)
#(CONFIG_NET_SOCKETS=y)
#(CONFIG_NET_SOCKETS_POSIX_NAMES=y)

# Enable the UART driver (nRF54L15 uses UART20, not UART0)

#CONFIG_NET_LOG=y
CONFIG_LOG=y

#  CONFIG_SERIAL=y
# USART printf support (UART console backend for logging)
#  CONFIG_CONSOLE=y
#  CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# ensure printk available
#  CONFIG_PRINTK=y

# Shell
CONFIG_SHELL_LOG_BACKEND=n

# ensure use nrf54l15 INTERNAL CLOCK
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
